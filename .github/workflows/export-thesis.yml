name: Export Thesis PDF

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "thesis/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  export:
    name: Compile thesis/main.typ
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          working_directory: thesis

      # Arial and Verdana are in the template's sans font fallback list
      - name: Install Microsoft core fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accept-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer

      - name: Compile PDF
        working-directory: thesis
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%at) \
            typst compile main.typ thesis.pdf --font-path fonts --pdf-standard a-3u

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: thesis/thesis.pdf
          if-no-files-found: error

      # Keep a single rolling release that always holds the PDF of the latest push to main
      - name: Publish PDF as release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete thesis-latest --cleanup-tag --yes || true
          gh release create thesis-latest thesis/thesis.pdf \
            --target "$GITHUB_SHA" \
            --title "Thesis (latest)" \
            --notes "PDF of thesis/main.typ built from commit $GITHUB_SHA." \
            --latest
