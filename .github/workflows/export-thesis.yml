name: Export Thesis PDF

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths:
      - "thesis/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  export:
    name: Compile thesis/main.typ
    runs-on: ubuntu-latest
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          working_directory: thesis

      # Arial and Verdana are in the template's sans font fallback list
      - name: Install Microsoft core fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accept-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y ttf-mscorefonts-installer

      - name: Compile PDF
        working-directory: thesis
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%at) \
            typst compile main.typ thesis.pdf --font-path fonts --pdf-standard a-3u

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: thesis/thesis.pdf
          if-no-files-found: error

      - name: Attach PDF to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: thesis/thesis.pdf
