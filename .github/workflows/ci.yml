name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PR Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Check Typst formatting
        run: |
          mise run fmt:typst
          git diff --exit-code || (echo "Typst files not formatted. Run 'mise run fmt:typst'." && exit 1)

      - name: Check template compilable
        run: mise run check:template-compilable
