#:schema https://mise.jdx.dev/schema/mise-task.json

["check:format"]
description = "Check the formatting of the code"
run = [
    {task = "fmt", env = {FMT_CHECK_ONLY = "true"}},
]

["check:template-compilable"]
description = "Check if the template is compilable"
depends = ["setup:editable-package"]
run = [
    "typst compile -f pdf --pdf-standard a-3u template/main.typ - > /dev/null",
]

["check"]
description = "Check the code"
run = [
    {task = "check:format"},
    {task = "check:template-compilable"},
]
