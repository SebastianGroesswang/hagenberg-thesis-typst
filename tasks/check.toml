#:schema https://mise.jdx.dev/schema/mise-task.json

["check:format"]
description = "Check the formatting of the code"
depends = ["FMT_CHECK_ONLY=true fmt:?*"]

["check:compilable"]
description = "Check if the template and content files are compilable"
depends = ["setup:editable-package"]
run = [
    "typst compile -f pdf --pdf-standard a-3u template/main.typ - > /dev/null",
    "typst compile -f pdf --pdf-standard a-3u --input is-classic=true thumbnail/content.typ - > /dev/null",
    "typst compile -f pdf --pdf-standard a-3u --input is-classic=false thumbnail/content.typ - > /dev/null",
]

["check"]
description = "Check the code"
depends = ["check:format", "check:compilable"]
